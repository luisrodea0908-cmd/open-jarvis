name: Compilar Open Jarvis APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar Codigo
        uses: actions/checkout@v4

      - name: 2. Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Gradle Oficial
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.2'

      - name: 5. Compilar APK
        run: |
          PROJECT_DIR=$(find . -maxdepth 3 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace --no-daemon

      - name: 6. Subir APK a Descargas
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14