name: Compilar Open Jarvis APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite compilar con 1 botón desde el móvil

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Configurar Gradle 8.2 Oficial
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.2'

      - name: 5. Compilar APK (assembleDebug)
        run: |
          # Detecta si está en raíz o subcarpeta
          PROJECT_DIR=$(find . -maxdepth 3 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi
          echo "Compilando en: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace --no-daemon

      - name: 6. Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
