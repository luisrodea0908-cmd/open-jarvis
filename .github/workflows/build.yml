name: Compilar Open Jarvis APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite compilar con 1 botÃ³n desde el mÃ³vil

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar CÃ³digo Fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permisos de ejecuciÃ³n a Gradle
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
