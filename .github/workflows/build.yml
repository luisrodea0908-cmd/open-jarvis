name: Compilar Open Jarvis APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite compilar con 1 botón desde el móvil

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Configurar Gradle 8.2 y Permisos
        run: |
          echo "=== 4.1 Buscando directorio del proyecto ==="
          PROJECT_DIR=$(find . -maxdepth 3 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi
          echo "Carpeta detectada: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          cd "$PROJECT_DIR"

          # Instalar Gradle 8.2.2 oficial para máxima compatibilidad con AGP 8.2
          echo "=== 4.2 Descargando Gradle 8.2.2 ==="
          wget -q https://services.gradle.org/distributions/gradle-8.2.2-bin.zip
          unzip -q -o gradle-8.2.2-bin.zip
          export PATH="$(pwd)/gradle-8.2.2/bin:$PATH"

          # Generar wrapper limpio con versión 8.2.2
          gradle wrapper --gradle-version 8.2.2 --distribution-type bin
          chmod +x gradlew || true

      - name: 5. Compilar APK (assembleDebug)
        run: |
          cd "$PROJECT_DIR"
          export PATH="$(pwd)/gradle-8.2.2/bin:$PATH"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 6. Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
